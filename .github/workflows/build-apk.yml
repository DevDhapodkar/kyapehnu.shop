name: Build Android APK

# Builds a real, installable APK for the Kya Pehnu? app on GitHub's runners
# (which have the Android SDK + open network — the dev sandbox has neither) and
# commits it to the repository root as kya-pehnu.apk.
#
# Run it from the Actions tab → "Build Android APK" → Run workflow, or it is
# triggered programmatically. The release build type is signed with the
# auto-generated debug keystore (React Native template default), so the APK
# installs on any device with "install unknown apps" enabled.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: customer-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: customer-app
        run: npm install --no-audit --no-fund

      - name: Prebuild Android project
        working-directory: customer-app
        run: npx expo prebuild --platform android --no-install

      - name: Assemble release APK
        working-directory: customer-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish APK to repo root
        run: |
          set -e
          APK=$(find customer-app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Built: $APK"
          cp "$APK" kya-pehnu.apk
          ls -la kya-pehnu.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kya-pehnu-apk
          path: kya-pehnu.apk

      - name: Commit APK to root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f kya-pehnu.apk
          if git diff --cached --quiet; then
            echo "APK unchanged — nothing to commit."
          else
            git commit -m "build: Android APK (kya-pehnu.apk) [skip ci]"
            git push
          fi
