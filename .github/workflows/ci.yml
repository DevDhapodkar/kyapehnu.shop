name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/kyapehnu-test
      ADMIN_JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Integration tests run against a REAL MongoDB. mongodb-memory-server
      # downloads a mongod and starts a single-node replica set (so the
      # transactional order path is exercised). GitHub runners allow the
      # binary download that the dev sandbox's egress policy blocks.
      - run: npm run test:integration
