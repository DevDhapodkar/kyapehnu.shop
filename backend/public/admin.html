<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kya Pehnu? — Admin</title>
    <style>
      :root {
        --obsidian: #050506; --deep: #0a0a0c; --charcoal: #131316; --line: rgba(245,243,239,.12);
        --ivory: #f5f3ef; --ash: #8a8891; --slate: #5c5a63; --crimson: #c4243a; --gold: #c8a24a; --green: #3fb27f;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--obsidian); color: var(--ivory);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      header { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex;
        align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--deep); z-index: 5; }
      h1 { font-size: 16px; font-weight: 300; letter-spacing: 2px; margin: 0; }
      h1 b { color: var(--gold); font-weight: 400; }
      main { max-width: 920px; margin: 0 auto; padding: 22px; }
      .muted { color: var(--ash); }
      .card { background: var(--charcoal); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
      label { display: block; font-size: 11px; letter-spacing: 1px; color: var(--slate); margin: 10px 0 5px; }
      input, textarea { width: 100%; background: var(--deep); border: 1px solid var(--line); border-radius: 8px;
        color: var(--ivory); padding: 11px; font-size: 15px; }
      button { cursor: pointer; border-radius: 8px; border: 1px solid var(--line); padding: 10px 16px;
        font-size: 13px; font-weight: 600; letter-spacing: .5px; background: var(--charcoal); color: var(--ivory); }
      button.primary { background: var(--crimson); border-color: var(--crimson); }
      button.ok { background: var(--green); border-color: var(--green); color: #04120c; }
      button.ghost { background: transparent; color: var(--ash); }
      button:disabled { opacity: .5; cursor: default; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 18px; }
      .stat { background: var(--charcoal); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
      .stat .n { font-size: 26px; font-weight: 300; }
      .stat .l { font-size: 11px; letter-spacing: 1px; color: var(--ash); text-transform: uppercase; }
      .tabs { display: flex; gap: 8px; margin: 6px 0 16px; }
      .tabs button.active { background: var(--charcoal); color: var(--ivory); border-color: var(--slate); }
      .thumbs { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
      .thumbs img { width: 74px; height: 98px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
      .pill { font-size: 10px; letter-spacing: 1px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ash); }
      .err { color: var(--crimson); font-size: 13px; margin-top: 10px; }
      .hidden { display: none; }
      .title { font-size: 17px; font-weight: 400; }
      .sub { color: var(--ash); font-size: 13px; margin-top: 2px; }
      hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>KYA PEHNU? · <b>ADMIN</b></h1>
      <button id="logout" class="ghost hidden" onclick="logout()">Sign out</button>
    </header>
    <main>
      <!-- First-run setup -->
      <section id="setup" class="card hidden" style="max-width: 380px; margin: 40px auto;">
        <div class="title">Create your admin account</div>
        <div class="sub" style="margin-bottom: 8px">First-run setup — this is the only time you'll see this.</div>
        <label>NAME</label>
        <input id="setupName" type="text" placeholder="Your name" />
        <label>EMAIL</label>
        <input id="setupEmail" type="email" autocomplete="username" placeholder="admin@kyapehnu.shop" />
        <label>PASSWORD (min 8 chars)</label>
        <input id="setupPassword" type="password" autocomplete="new-password" placeholder="••••••••" />
        <div style="margin-top: 16px"><button class="primary" onclick="setup()">Create account</button></div>
        <div id="setupErr" class="err"></div>
      </section>

      <!-- Login -->
      <section id="login" class="card hidden" style="max-width: 380px; margin: 40px auto;">
        <div class="title">Admin sign in</div>
        <label>EMAIL</label>
        <input id="email" type="email" autocomplete="username" placeholder="admin@kyapehnu.shop" />
        <label>PASSWORD</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        <div style="margin-top: 16px"><button class="primary" onclick="login()">Log in</button></div>
        <div id="loginErr" class="err"></div>
      </section>

      <!-- Dashboard -->
      <section id="dash" class="hidden">
        <div class="stats" id="stats"></div>
        <div class="tabs">
          <button id="tab-products" class="active" onclick="showTab('products')">QC Queue</button>
          <button id="tab-add" onclick="showTab('add')">Add Product</button>
          <button id="tab-shops" onclick="showTab('shops')">Shops</button>
          <button id="tab-orders" onclick="showTab('orders')">Orders</button>
        </div>

        <div id="panel-products"></div>

        <div id="panel-add" class="hidden">
          <div class="card">
            <div class="title" style="margin-bottom:6px">Add a product (goes live immediately)</div>
            <label>SHOP</label>
            <select id="apShop" style="width:100%;background:var(--deep);border:1px solid var(--line);border-radius:8px;color:var(--ivory);padding:11px;font-size:15px"></select>
            <div class="row" style="margin-top:10px">
              <div style="flex:2;min-width:180px"><label>NAME</label><input id="apName" placeholder="Obsidian Evening Shirt" /></div>
              <div style="flex:1;min-width:120px"><label>CATEGORY</label>
                <select id="apCat" style="width:100%;background:var(--deep);border:1px solid var(--line);border-radius:8px;color:var(--ivory);padding:11px">
                  <option>MEN</option><option>WOMEN</option><option>KIDS</option><option>UNISEX</option>
                </select>
              </div>
            </div>
            <div class="row" style="margin-top:10px">
              <div style="flex:1"><label>SELLING PRICE (₹)</label><input id="apPrice" inputmode="numeric" placeholder="2400" /></div>
              <div style="flex:1"><label>MRP (₹)</label><input id="apMrp" inputmode="numeric" placeholder="3200" /></div>
              <div style="flex:1"><label>BRAND</label><input id="apBrand" placeholder="Optional" /></div>
            </div>
            <label>SIZES & STOCK (e.g. S:3, M:5, L:2)</label><input id="apSizes" placeholder="S:3, M:5, L:2" />
            <label>COLOURS (comma separated)</label><input id="apColors" placeholder="Black, Ivory" />
            <label>IMAGE URLS (comma separated)</label><input id="apImages" placeholder="https://…jpg, https://…jpg" />
            <div class="row" style="margin-top:10px">
              <div style="flex:1"><label>MATERIAL</label><input id="apMaterial" placeholder="100% Cotton" /></div>
              <div style="flex:1"><label>NET QTY</label><input id="apNetQty" inputmode="numeric" placeholder="1" /></div>
            </div>
            <label>DESCRIPTION</label><textarea id="apDesc" rows="2" placeholder="Optional"></textarea>
            <div style="margin-top:14px"><button class="ok" onclick="createProductAdmin()">Add product</button></div>
            <div id="apMsg" class="sub" style="margin-top:8px"></div>
          </div>
        </div>

        <div id="panel-shops" class="hidden">
          <div class="card">
            <div class="title" style="margin-bottom:6px">Create a shop</div>
            <div class="row">
              <div style="flex:1;min-width:160px"><label>SHOP NAME</label><input id="shName" placeholder="Sitabuldi Silks" /></div>
              <div style="flex:1;min-width:160px"><label>OWNER</label><input id="shOwner" placeholder="Priya Deshmukh" /></div>
            </div>
            <div class="row" style="margin-top:10px">
              <div style="flex:1"><label>PHONE</label><input id="shPhone" placeholder="98765 43210" /></div>
              <div style="flex:1"><label>AREA</label><input id="shArea" placeholder="Sitabuldi" /></div>
              <div style="flex:1"><label>PINCODE</label><input id="shPin" placeholder="440012" /></div>
            </div>
            <div style="margin-top:14px"><button class="ok" onclick="createShop()">Create shop</button></div>
            <div id="shMsg" class="sub" style="margin-top:8px"></div>
          </div>
          <div id="shopsList"></div>
        </div>

        <div id="panel-orders" class="hidden"></div>
      </section>
    </main>

    <script>
      const TOKEN_KEY = 'kp_admin_token';
      let token = null;
      try { token = localStorage.getItem(TOKEN_KEY); } catch {}

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      async function api(path, options = {}) {
        const res = await fetch('/api/admin' + path, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { Authorization: 'Bearer ' + token } : {}),
            ...(options.headers || {}),
          },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || ('Request failed (' + res.status + ')'));
        return data;
      }

      // Show the setup form on a fresh install (no admin yet), otherwise login.
      async function showAuthScreen() {
        $('dash').classList.add('hidden');
        $('logout').classList.add('hidden');
        let needsSetup = false;
        try { needsSetup = (await api('/needs-setup')).needsSetup; } catch {}
        $('setup').classList.toggle('hidden', !needsSetup);
        $('login').classList.toggle('hidden', needsSetup);
      }

      async function setup() {
        $('setupErr').textContent = '';
        try {
          const { token: t } = await api('/setup', {
            method: 'POST',
            body: JSON.stringify({
              name: $('setupName').value.trim(),
              email: $('setupEmail').value.trim(),
              password: $('setupPassword').value,
            }),
          });
          token = t;
          try { localStorage.setItem(TOKEN_KEY, t); } catch {}
          enterDashboard();
        } catch (e) {
          $('setupErr').textContent = e.message;
        }
      }

      async function login() {
        $('loginErr').textContent = '';
        try {
          const { token: t } = await api('/login', {
            method: 'POST',
            body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value }),
          });
          token = t;
          try { localStorage.setItem(TOKEN_KEY, t); } catch {}
          enterDashboard();
        } catch (e) {
          $('loginErr').textContent = e.message;
        }
      }

      function logout() {
        token = null;
        try { localStorage.removeItem(TOKEN_KEY); } catch {}
        showAuthScreen();
      }

      const TABS = ['products', 'add', 'shops', 'orders'];
      function showTab(which) {
        TABS.forEach((t) => {
          $('panel-' + t).classList.toggle('hidden', t !== which);
          $('tab-' + t).classList.toggle('active', t === which);
        });
        if (which === 'shops') loadShops();
        if (which === 'add') loadShopsIntoForm();
        if (which === 'orders') loadOrders();
      }

      async function enterDashboard() {
        $('login').classList.add('hidden');
        $('setup').classList.add('hidden');
        $('dash').classList.remove('hidden');
        $('logout').classList.remove('hidden');
        await Promise.all([loadStats(), loadProducts(), loadShops()]);
      }

      async function loadStats() {
        try {
          const s = await api('/stats');
          $('stats').innerHTML = [
            ['Pending products', s.pendingProducts],
            ['Pending vendors', s.pendingVendors],
            ['Total vendors', s.totalVendors],
            ['Total orders', s.totalOrders],
          ].map(([l, n]) => '<div class="stat"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>').join('');
        } catch (e) { if (/token/i.test(e.message)) logout(); }
      }

      async function loadProducts() {
        const panel = $('panel-products');
        try {
          const items = await api('/products/pending');
          if (!items.length) { panel.innerHTML = '<div class="card muted">QC queue is empty. 🎉</div>'; return; }
          panel.innerHTML = items.map((p) => {
            const imgs = (p.images || []).map((u) => '<img src="' + esc(u) + '" alt="" />').join('');
            return '<div class="card" id="p-' + p._id + '">' +
              '<div class="row" style="justify-content:space-between">' +
                '<div><div class="title">' + esc(p.name) + '</div>' +
                '<div class="sub">' + esc(p.category) + ' · ₹' + esc(p.price) +
                ' · ' + esc(p.vendor?.shopName || 'Unknown shop') + '</div></div>' +
                '<span class="pill">PENDING_QC</span></div>' +
              (imgs ? '<div class="thumbs">' + imgs + '</div>' : '<div class="sub" style="margin-top:8px">No photos submitted</div>') +
              (p.description ? '<div class="sub" style="margin-top:8px">' + esc(p.description) + '</div>' : '') +
              '<hr /><div class="row" style="margin-bottom:8px;align-items:center">' +
                '<label style="margin:0;font-size:12px;color:var(--ash);font-weight:600">SET PRINTED MRP (₹):</label>' +
                '<input id="mrp-' + p._id + '" type="number" value="' + (p.mrp || p.price || '') + '" style="width:110px;padding:6px 10px;font-size:14px;border-radius:6px;background:var(--deep);color:var(--ivory);border:1px solid var(--line)" placeholder="e.g. ' + (p.price || 2000) + '" />' +
                '<span class="muted" style="font-size:12px">Vendor Selling Price: ₹' + esc(p.price) + '</span>' +
              '</div>' +
              '<div class="row">' +
                '<button class="ok" onclick="reviewProduct(\'' + p._id + '\',\'APPROVE\')">Approve (Set MRP & Go Live)</button>' +
                '<input id="reason-' + p._id + '" placeholder="Reason (required to reject)" style="flex:1;min-width:160px" />' +
                '<button onclick="reviewProduct(\'' + p._id + '\',\'REJECT\')">Reject</button>' +
              '</div></div>';
          }).join('');
        } catch (e) {
          if (/token/i.test(e.message)) return logout();
          panel.innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
        }
      }

      async function reviewProduct(id, decision) {
        const reason = decision === 'REJECT' ? ($('reason-' + id)?.value || '').trim() : undefined;
        if (decision === 'REJECT' && !reason) { alert('A reason is required to reject.'); return; }
        const mrpVal = $('mrp-' + id)?.value ? Number($('mrp-' + id).value) : undefined;
        try {
          await api('/products/' + id + '/review', { method: 'PATCH', body: JSON.stringify({ decision, reason, mrp: mrpVal }) });
          $('p-' + id)?.remove();
          loadStats();
        } catch (e) { alert(e.message); }
      }

      let SHOPS = [];
      async function loadShops() {
        try {
          SHOPS = await api('/vendors');
          loadShopsIntoForm();
          const panel = $('shopsList');
          if (!SHOPS.length) { panel.innerHTML = '<div class="card muted">No shops yet — create one above.</div>'; return; }
          panel.innerHTML = SHOPS.map((v) => {
            const pending = v.approvalStatus === 'PENDING';
            return '<div class="card" id="v-' + v._id + '">' +
              '<div class="row" style="justify-content:space-between">' +
                '<div><div class="title">' + esc(v.shopName) + '</div>' +
                '<div class="sub">' + esc(v.ownerName || '') + ' · ' + esc(v.address?.area || '') + '</div></div>' +
                '<span class="pill">' + esc(v.approvalStatus) + '</span></div>' +
              (pending ? '<hr /><div class="row">' +
                '<button class="ok" onclick="reviewVendor(\'' + v._id + '\',\'APPROVE\')">Approve</button>' +
                '<button onclick="reviewVendor(\'' + v._id + '\',\'REJECT\')">Reject</button></div>' : '') +
              '</div>';
          }).join('');
        } catch (e) {
          if (/token/i.test(e.message)) return logout();
          $('shopsList').innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
        }
      }

      function loadShopsIntoForm() {
        const approved = SHOPS.filter((v) => v.approvalStatus === 'APPROVED');
        $('apShop').innerHTML = approved.length
          ? approved.map((v) => '<option value="' + v._id + '">' + esc(v.shopName) + '</option>').join('')
          : '<option value="">Create a shop first (Shops tab)</option>';
      }

      async function reviewVendor(id, decision) {
        try {
          await api('/vendors/' + id + '/review', { method: 'PATCH', body: JSON.stringify({ decision }) });
          loadShops(); loadStats();
        } catch (e) { alert(e.message); }
      }

      async function createShop() {
        $('shMsg').textContent = '';
        try {
          const v = await api('/vendors', { method: 'POST', body: JSON.stringify({
            shopName: $('shName').value.trim(), ownerName: $('shOwner').value.trim(),
            phone: $('shPhone').value.trim(), area: $('shArea').value.trim(), pincode: $('shPin').value.trim(),
          })});
          $('shMsg').innerHTML = '<span style="color:var(--green)">✓ Created ' + esc(v.shopName) + '</span>';
          ['shName','shOwner','shPhone','shArea','shPin'].forEach((id) => ($(id).value = ''));
          loadShops();
        } catch (e) { $('shMsg').innerHTML = '<span style="color:var(--crimson)">' + esc(e.message) + '</span>'; }
      }

      const splitList = (s) => s.split(',').map((x) => x.trim()).filter(Boolean);
      const parseSizes = (s) => splitList(s).map((c) => { const [size, st] = c.split(':').map((x) => x.trim());
        const n = Number(st); return { size, stock: Number.isFinite(n) && n >= 0 ? n : 1 }; });

      async function createProductAdmin() {
        $('apMsg').textContent = '';
        const vendor = $('apShop').value;
        if (!vendor) { $('apMsg').innerHTML = '<span style="color:var(--crimson)">Create a shop first.</span>'; return; }
        try {
          const p = await api('/products', { method: 'POST', body: JSON.stringify({
            vendor, name: $('apName').value.trim(), category: $('apCat').value,
            price: Number($('apPrice').value), mrp: $('apMrp').value ? Number($('apMrp').value) : undefined,
            brand: $('apBrand').value.trim() || undefined,
            sizes: parseSizes($('apSizes').value), colors: splitList($('apColors').value),
            images: splitList($('apImages').value), material: $('apMaterial').value.trim() || undefined,
            netQuantity: Number($('apNetQty').value) || 1, description: $('apDesc').value.trim() || undefined,
          })});
          $('apMsg').innerHTML = '<span style="color:var(--green)">✓ "' + esc(p.name) + '" is live (SKU ' + esc(p.sku) + ')</span>';
          ['apName','apPrice','apMrp','apBrand','apSizes','apColors','apImages','apMaterial','apDesc'].forEach((id) => ($(id).value = ''));
        } catch (e) { $('apMsg').innerHTML = '<span style="color:var(--crimson)">' + esc(e.message) + '</span>'; }
      }

      const NEXT_STATUS = { PENDING:['ACCEPTED','CANCELLED'], ACCEPTED:['PACKED','CANCELLED'],
        PACKED:['READY_FOR_PICKUP','CANCELLED'], READY_FOR_PICKUP:['IN_TRANSIT'], IN_TRANSIT:['DELIVERED'] };
      const STATUS_LABEL = { PENDING:'Placed', ACCEPTED:'Accepted', PACKED:'Packed',
        READY_FOR_PICKUP:'Ready', IN_TRANSIT:'Out for delivery', DELIVERED:'Delivered', CANCELLED:'Cancelled' };
      const NEXT_LABEL = { ACCEPTED:'Accept', PACKED:'Mark packed', READY_FOR_PICKUP:'Mark ready',
        IN_TRANSIT:'Out for delivery', DELIVERED:'Mark delivered', CANCELLED:'Cancel' };

      async function loadOrders() {
        const panel = $('panel-orders');
        try {
          const orders = await api('/orders?limit=100');
          if (!orders.length) { panel.innerHTML = '<div class="card muted">No orders yet.</div>'; return; }
          panel.innerHTML = orders.map((o) => {
            const who = o.customer?.name || o.guestContact?.name || 'Customer';
            const phone = o.customer?.phone || o.guestContact?.phone || '';
            const next = (NEXT_STATUS[o.status] || []).map((s) =>
              '<button class="' + (s === 'CANCELLED' ? '' : 'ok') + '" onclick="advanceOrder(\'' + o._id + '\',\'' + s + '\')">' + NEXT_LABEL[s] + '</button>').join(' ');
            return '<div class="card" id="o-' + o._id + '">' +
              '<div class="row" style="justify-content:space-between">' +
                '<div><div class="title">#' + esc(String(o._id).slice(-6).toUpperCase()) + ' · ' + esc(o.vendor?.shopName || '') + '</div>' +
                '<div class="sub">' + esc(who) + (phone ? ' · ' + esc(phone) : '') + ' · ₹' + esc(o.totalPrice) + ' · ' + esc(o.paymentMethod) + '</div></div>' +
                '<span class="pill">' + esc(STATUS_LABEL[o.status] || o.status) + '</span></div>' +
              (next ? '<hr /><div class="row">' + next + '</div>' : '') + '</div>';
          }).join('');
        } catch (e) {
          if (/token/i.test(e.message)) return logout();
          panel.innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
        }
      }

      async function advanceOrder(id, status) {
        if (status === 'CANCELLED' && !confirm('Cancel this order?')) return;
        try {
          await api('/orders/' + id + '/status', { method: 'PATCH', body: JSON.stringify({ status }) });
          loadOrders();
        } catch (e) { alert(e.message); }
      }

      // Auto-enter if a stored token still works; otherwise show setup or login.
      if (token) enterDashboard().catch(showAuthScreen);
      else showAuthScreen();
    </script>
  </body>
</html>
