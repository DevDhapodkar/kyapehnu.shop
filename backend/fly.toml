# Fly.io config for the Kya Pehnu? backend.
#
# primary_region = bom (Mumbai) puts the API next to the Nagpur user base, and
# auto_stop_machines = "off" + min_machines_running keep it always warm — no
# free-tier cold start. Secrets are NOT stored here; set them with
# `fly secrets set` (see DEPLOY.md). Change `app` to the name you secured with
# `fly launch`, and point customer-app/app.json's apiBaseUrl at its URL.
app = "kyapehnu-backend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: the machine never idles out, so the first request after a lull is
  # as fast as the rest. Flip auto_stop_machines to "stop" only if you want to
  # trade that for scale-to-zero cost savings.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Liveness probe against the app's own health route.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
